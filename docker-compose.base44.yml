services:
  web:
    image: node:20-slim
    working_dir: /app/brian-the-trader
    volumes:
      - ./:/app
      - web_node_modules:/app/brian-the-trader/node_modules
    ports:
      - "3000:3000"
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    command: sh -c "npm install && npx rsbuild dev --port 3000"
    restart: unless-stopped

volumes:
  web_node_modules:
